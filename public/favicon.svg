<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- moeda dourada -->
  <circle cx="32" cy="32" r="22" fill="url(#coin)"/>
  <circle cx="26" cy="24" r="14" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-opacity="0.15"/>

  <!-- símbolo de dinheiro -->
  <text x="32" y="40" text-anchor="middle" font-size="28" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-weight="700" fill="#0f172a">$</text>
</svg>